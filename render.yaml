# Render Blueprint — use when this repo root IS the backend (no backend/ subfolder)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: siu-graduate-api
    runtime: java
    region: oregon
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -Dspring.profiles.active=prod -jar target/Graduate_Project.jar
    healthCheckPath: /api/health
    envVars:
      - key: JAVA_VERSION
        value: "17"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: MONGODB_URI
        sync: false
      - key: APP_CORS_ORIGINS
        sync: false
