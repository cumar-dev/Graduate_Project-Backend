# Render Blueprint — Docker (Java is not in the "Language" dropdown; use Docker)
services:
  - type: web
    name: siu-graduate-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: MONGODB_URI
        sync: false
      - key: APP_CORS_ORIGINS
        sync: false
