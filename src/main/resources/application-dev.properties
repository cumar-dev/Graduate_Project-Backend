# Local development — API at http://localhost:9090/api
# Frontend runs separately on http://localhost:5173
# MongoDB: Atlas (set MONGODB_URI in backend/.env)

server.port=9090
server.servlet.context-path=

spring.data.mongodb.uri=${MONGODB_URI}

# Session cookies for cross-port dev (frontend :5173 → API via proxy or CORS)
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/
