# Production (Render) — set variables in Render → Environment

server.port=${PORT:10000}
server.servlet.context-path=

# Required — MongoDB Atlas connection string
spring.data.mongodb.uri=${MONGODB_URI}

# Cross-origin session cookies (Vercel frontend → Render API)
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/

# Comma-separated origins; default allows all Vercel URLs
app.cors.allowed-origins=${APP_CORS_ORIGINS:https://*.vercel.app}
